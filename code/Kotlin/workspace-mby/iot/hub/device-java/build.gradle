plugins {
    alias conventionLibs.plugins.jvmLibrary
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api 'org.slf4j:slf4j-log4j12:1.7.36'
    api 'org.slf4j:slf4j-api:1.7.36'
    api "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
    api "com.squareup.okhttp3:okhttp:4.12.0"
    api 'org.json:json:20190722'
    api 'org.bouncycastle:bcprov-jdk15on:1.67'
    api 'org.bouncycastle:bcpkix-jdk15on:1.67'
    //WebSocket
    api 'org.java-websocket:Java-WebSocket:1.5.2'
    testImplementation 'junit:junit:4.13.2'

    implementation(androidxLibs.annotation)
}